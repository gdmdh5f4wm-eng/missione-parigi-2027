<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="babiGoldWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F7FF" />
      <stop offset="100%" stop-color="#D6E4FA" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Elegant Upper Arch Arc -->
  <path
    d="M 68 112 C 100 52, 220 52, 252 112"
    stroke="url(#babiGoldWhite)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.85"
    filter="url(#cardShadow)"
  />

  <!-- Subtle sparkle on the arch -->
  <path
    d="M 252 112 Q 256 112 257 108 Q 258 112 262 112 Q 258 112 257 116 Q 256 112 252 112 Z"
    fill="#FFFFFF"
  />

  <!-- Lettering Babi centered with drop shadow for legibility above video -->
  <text
    x="160"
    y="108"
    font-family="'Ubuntu', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="4"
    text-anchor="middle"
    fill="url(#babiGoldWhite)"
    filter="url(#cardShadow)"
  >
    Babi
  </text>
</svg>
